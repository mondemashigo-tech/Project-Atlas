# PRE-REGISTERED HYPOTHESIS — frozen. Do not edit thresholds after a run.
# Source: ZPK FX Research v1.0 (London Session Trend Continuation).
name: london_trend_continuation
version: "1.0"
template: trend_continuation

markets: [GBPUSD, USDJPY]

timeframes:
  bias: H1        # trend direction
  entry: M5       # execution

session:
  start: "08:00"
  end: "11:00"
  tz: "Europe/London"

weekdays: [1, 2, 3]   # Tue, Wed, Thu (Mon=0)

trend:
  ema_fast: 50
  ema_slow: 200

entry:
  pullback_ema: 20     # pull back to the M5 20-EMA
  confirmation: candle # close beyond the open in the trend direction

risk:
  stop:
    type: atr
    atr_mult: 1.0
    atr_period: 14
    swing_lookback: 20   # stop = max(swing, atr_mult*ATR)
  target_r: 2.0
  risk_pct: 1.0
  max_trades_per_day: 3

costs:
  spread_pips: 1.0
  commission_r: 0.03     # ~3% of risk per trade in round-turn costs

criteria:
  success:
    profit_factor: 1.5
    min_trades: 200
    max_drawdown_pct: 10
    expectancy: positive
  failure:
    profit_factor: 1.2
    expectancy: negative
    max_drawdown_pct: 15

# Split: optimise/inspect in-sample; JUDGE on out-of-sample only.
data:
  in_sample: ["2023-01-01", "2024-12-31"]
  out_sample: ["2025-01-01", "2025-12-31"]

research_questions:
  - Does GBPUSD outperform USDJPY?
  - Does the edge survive costs?
  - Can it be automated?
