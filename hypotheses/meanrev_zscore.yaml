# PRE-REGISTERED — frozen. Counter-trend z-score fade.
# Split matches the only real data we have (OctaFX M5, 2025-03 -> 2026-07):
# a PASS here is PRELIMINARY (one regime) and earns a test on deeper data, not
# a live trade.
name: meanrev_zscore
version: "1.0"
template: mean_reversion

markets: [GBPUSD, USDJPY]

timeframes:
  entry: M5

weekdays: [0, 1, 2, 3, 4]   # all-day, so robust to broker-time offset

meanrev:
  ma_period: 20
  entry_z: 2.0          # fade moves >2 std from the 20-period mean
  exit: mean            # target = the moving average (mean|rr)

risk:
  stop:
    type: atr
    atr_mult: 1.5
    atr_period: 14
  target_r: 1.5         # only used if exit: rr
  max_trades_per_day: 3

costs:
  spread_pips: 1.0
  commission_r: 0.03

criteria:
  success:
    profit_factor: 1.3
    min_trades: 150
    max_drawdown_pct: 15
    expectancy: positive
  failure:
    profit_factor: 1.0
    expectancy: negative

data:
  in_sample: ["2025-03-21", "2026-01-31"]
  out_sample: ["2026-02-01", "2026-07-31"]
