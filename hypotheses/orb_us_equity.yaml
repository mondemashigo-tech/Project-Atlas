# PRE-REGISTERED — the "social-media ORB" reverse-engineered from a described
# video (rules are ASSUMPTIONS; the video could not be watched). Frozen before
# results are seen. Judged on out-of-sample only.
#
# Market: US equity index ETF (SPY/QQQ). Session in EXCHANGE time (America/
# New_York). If the price data is stamped in another timezone, set
# session.data_utc_offset so 09:30 lines up with the real cash open.
name: orb_us_equity
version: "1.0"
template: orb

markets: [SPY, QQQ]

timeframes:
  entry: M5           # 5-minute bars (the opening range is one 5-min candle)

session:
  start: "09:30"      # US cash open
  end: "16:00"
  tz: "America/New_York"

weekdays: [0, 1, 2, 3, 4]

orb:
  range_minutes: 5    # first 5-minute candle = the opening range
  ema: 20             # trade only with the 20-EMA

risk:
  stop:
    type: opposite_range   # opposite_range | atr
    atr_mult: 1.0
    atr_period: 14
  target_r: 2.0
  max_trades_per_day: 1    # ORB convention: one shot per day

costs:
  spread_pips: 0.0         # equities: model cost via commission_r, not pips
  commission_r: 0.02       # ~2% of risk per round turn (fees + slippage)

# The exact grid from the brief. The optimiser searches these on IN-SAMPLE only;
# out-of-sample is the verdict, never the selection signal.
optimize:
  orb.range_minutes: [5, 10, 15]
  orb.ema: [10, 20, 50]
  risk.target_r: [1.0, 2.0, 3.0]
  risk.stop.type: [opposite_range, atr]

criteria:
  success:
    profit_factor: 1.3
    min_trades: 200
    max_drawdown_pct: 15
    expectancy: positive
  failure:
    profit_factor: 1.0
    expectancy: negative

# Split once real intraday data is loaded. Placeholder 3y IS / 2y OOS; adjust to
# the actual span the data provider serves.
data:
  in_sample: ["2020-01-01", "2022-12-31"]
  out_sample: ["2023-01-01", "2024-12-31"]

research_questions:
  - Does the ORB edge survive costs and out-of-sample?
  - Which opening-range length / EMA / R:R is robust vs curve-fit?
  - Does it hold across SPY and QQQ, or only one?
